# ai-auditor 容器化部署编排 —— 一键起全栈
#
# ┌ Nginx ─→ API×2 ─┐
# │        (least_conn)│  FastAPI：验签 / 幂等 / 建任务 → 202
# │                  ↓ enqueue
# │              Redis (AOF)  arq 队列 auditor
# │                  ↓
# └   Worker×2 ←──────┘  规则 → LLM 链 → 决策矩阵 → 路由回写（可扩容）
#                    ↓
#         PostgreSQL + pgvector（首次启动自动执行 sql/ddl.sql）
#
# 起停（在仓库根或 deploy/ 下均可）：
#   cp deploy/.env.example deploy/.env      # 修改全部 change-me 密钥
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl http://localhost:8300/healthz
#
# 要点：
# - **一键建库**：postgres 数据卷为空时自动执行 sql/ddl.sql（含 pgcrypto + pgvector
#   扩展、vector(1024) 列与 HNSW 索引），无需手工 psql；
# - **一次性 init 服务**：建库后装载 config/sops/*.yaml 到 flow_profile（幂等），
#   新审批流零代码接入只改配置；api/worker 待其成功退出后再启动；
# - **队列**：API 侧 queue_mode=arq（只受理入队），Worker 侧 inline（避免二次入队）；
# - **多活**：双 API 经 Nginx least_conn；Worker 可 `--scale` 扩容；
# - 控制台原型由 Nginx 托管于 /console/；调试工具 `--profile tools` 起 Adminer。

name: ai-auditor

# 应用层统一环境变量（独立锚点）：worker 服务用 {<<: *x-app-env, ...} 追加/覆盖，
# 避免 YAML 浅合并时子层 environment 整体替换基座、丢失 REDIS_URL 等必填项。
x-app-env: &x-app-env
  AUDITOR_DATABASE_URL: "postgresql+psycopg://auditor:${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}@postgres:5432/auditor"
  AUDITOR_REDIS_URL: "redis://:${REDIS_PASSWORD:?请在 deploy/.env 设置 REDIS_PASSWORD}@redis:6379/0"
  AUDITOR_QUEUE_MODE: "arq"
  AUDITOR_KERNEL_MODE: "${AUDITOR_KERNEL_MODE:-false}"
  AUDITOR_MAX_SUSPEND_ROUNDS: "${AUDITOR_MAX_SUSPEND_ROUNDS:-3}"
  AUDITOR_WEBHOOK_SECRET_DEFAULT: "${AUDITOR_WEBHOOK_SECRET_DEFAULT:?请在 deploy/.env 设置 AUDITOR_WEBHOOK_SECRET_DEFAULT}"
  AUDITOR_WEBHOOK_REPLAY_WINDOW_SECONDS: "${AUDITOR_WEBHOOK_REPLAY_WINDOW_SECONDS:-300}"
  AUDITOR_LLM_ENABLED: "${AUDITOR_LLM_ENABLED:-false}"
  AUDITOR_LLM_BASE_URL: "${AUDITOR_LLM_BASE_URL:-http://10.26.8.43:3002/v1}"
  AUDITOR_LLM_API_KEY: "${AUDITOR_LLM_API_KEY:-}"
  AUDITOR_LLM_MODEL: "${AUDITOR_LLM_MODEL:-gpt-4o-mini}"
  AUDITOR_RAG_ENABLED: "${AUDITOR_RAG_ENABLED:-false}"
  AUDITOR_EMBEDDING_MODEL: "${AUDITOR_EMBEDDING_MODEL:-text-embedding-3-small}"
  AUDITOR_CONF_HIGH: "${AUDITOR_CONF_HIGH:-0.90}"
  AUDITOR_CONF_LOW: "${AUDITOR_CONF_LOW:-0.60}"
  AUDITOR_SOPS_DIR: "/app/config/sops"

x-app-base: &app-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: ai-auditor:latest
  restart: unless-stopped
  # deploy/.env 提供密钥；下面的 environment 用 :? 对必填项做快速失败
  env_file: [.env]
  environment: *x-app-env
  # 资源上限（compose v2 非 Swarm 模式同样生效：cpus→--cpus，memory→--memory）
  # migrate / api×2 / worker×2 共用此锚点；重负载场景可整体上调
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
  volumes:
    # SOP 配置只读挂载：改 config/sops/*.yaml 后 `make load-sops` 即可生效，无需重建镜像
    - ../config/sops:/app/config/sops:ro
  networks: [auditor-net]

services:
  # ==================== 数据层 ====================
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}"
      POSTGRES_DB: auditor
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 数据卷为空时自动执行（含 pgcrypto + pgvector 扩展、全部业务表与索引）
      - ../sql/ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # 生产不对宿主机暴露；调试时用 127.0.0.1 前缀临时放开
    # ports: ["127.0.0.1:5432:5432"]
    networks: [auditor-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 deploy/.env 设置 REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 deploy/.env 设置 REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks: [auditor-net]

  # ==================== 一次性初始化（建表 + 装载 SOP） ====================
  migrate:
    <<: *app-base
    container_name: auditor-migrate
    restart: "no"                    # 一次性任务：跑完即退出（成功退出码 0）
    command: ["python", "-m", "app.cli", "init", "--seed"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==================== 应用层：API ×2（Nginx 后端） ====================
  api-1:
    <<: *app-base
    container_name: auditor-api-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8300/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-2:
    <<: *app-base
    container_name: auditor-api-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8300/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==================== 应用层：Worker ×2（可 --scale 扩容） ====================
  worker-1:
    <<: *app-base
    command: ["arq", "worker.settings.WorkerSettings"]
    environment:
      <<: *x-app-env
      AUDITOR_QUEUE_MODE: "inline"   # worker 进程内直接执行，避免二次入队
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker-2:
    <<: *app-base
    command: ["arq", "worker.settings.WorkerSettings"]
    environment:
      <<: *x-app-env
      AUDITOR_QUEUE_MODE: "inline"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==================== 接入层 ====================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../prototypes:/usr/share/nginx/html/console:ro   # 控制台原型（/console/）
    ports:
      - "${AUDITOR_EXPOSE_PORT:-8300}:80"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      # 必须用 127.0.0.1：listen 80 只绑 IPv4，localhost 会先解析 ::1 导致拒连
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks: [auditor-net]

  # ==================== 可选：数据库调试（--profile tools） ====================
  adminer:
    image: adminer:4
    profiles: [tools]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "${AUDITOR_ADMINER_PORT:-8301}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks: [auditor-net]

volumes:
  pg-data:
  redis-data:

networks:
  auditor-net:
    driver: bridge
