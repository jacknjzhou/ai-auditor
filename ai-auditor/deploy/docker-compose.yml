# ai-auditor 容器化部署编排 —— 2×API + 2×Worker + Nginx 多活 + PostgreSQL(pgvector) + Redis
#
# 用法：
#   cp .env.example .env && 修改密钥
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 说明：
# - queue_mode 强制 arq（API 只受理入站，审核任务全部经 Redis 队列由 Worker 执行）
# - API 双实例经 Nginx least_conn 负载均衡；Worker 可 `docker compose up -d --scale worker=4` 扩容
# - 首次建库：容器内执行 sql/ddl.sql（含 pgvector 扩展），见 README-container.md

name: ai-auditor

x-app-base: &app-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: ai-auditor:latest
  restart: unless-stopped
  env_file: .env
  environment:
    AUDITOR_DATABASE_URL: "postgresql+psycopg://auditor:${POSTGRES_PASSWORD}@postgres:5432/auditor"
    AUDITOR_REDIS_URL: "redis://redis:6379/0"
    AUDITOR_QUEUE_MODE: "arq"
    AUDITOR_LLM_BASE_URL: "${AUDITOR_LLM_BASE_URL}"
    AUDITOR_LLM_API_KEY: "${AUDITOR_LLM_API_KEY}"
    AUDITOR_LLM_ENABLED: "${AUDITOR_LLM_ENABLED:-false}"
    AUDITOR_RAG_ENABLED: "${AUDITOR_RAG_ENABLED:-false}"
    AUDITOR_WEBHOOK_SECRET_DEFAULT: "${AUDITOR_WEBHOOK_SECRET_DEFAULT}"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [auditor-net]

services:
  # ---------- 数据层 ----------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: auditor
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 5s
      timeout: 3s
      retries: 12
    # 生产建议不对外暴露端口；调试时再放开注释
    # ports: ["127.0.0.1:5432:5432"]
    networks: [auditor-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks: [auditor-net]

  # ---------- 应用层：API ×2（Nginx 后端） ----------
  api-1:
    <<: *app-base
    container_name: auditor-api-1
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8300/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-2:
    <<: *app-base
    container_name: auditor-api-2
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8300/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- 应用层：Worker ×2（可 scale） ----------
  worker-1:
    <<: *app-base
    container_name: auditor-worker-1
    command: ["arq", "worker.settings.WorkerSettings"]
    environment:
      AUDITOR_QUEUE_MODE: "inline"   # worker 进程内直接执行，不再二次入队
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker-2:
    <<: *app-base
    container_name: auditor-worker-2
    command: ["arq", "worker.settings.WorkerSettings"]
    environment:
      AUDITOR_QUEUE_MODE: "inline"
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------- 接入层 ----------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${AUDITOR_EXPOSE_PORT:-8300}:80"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [auditor-net]

volumes:
  pg-data:
  redis-data:

networks:
  auditor-net:
    driver: bridge
