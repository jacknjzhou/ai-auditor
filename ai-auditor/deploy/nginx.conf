# ai-auditor 接入层：least_conn 多活负载均衡
upstream auditor_api {
    least_conn;
    server api-1:8300 max_fails=3 fail_timeout=10s;
    server api-2:8300 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # webhook 报文可能带大附件元数据
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 入站受理本身很快（202 异步），读超时无需大
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://auditor_api;
    }

    location = /healthz {
        proxy_pass http://auditor_api/healthz;
        access_log off;
    }
}
